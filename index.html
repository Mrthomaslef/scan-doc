<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ScanDoc</title>
  <link rel="manifest" href="manifest.json?v=2.0.0" />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg?v=2.0.0" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2.0.0" />
  <meta name="theme-color" content="#0b1120" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ScanDoc" />
  <script src="data/embedded_data.js?v=2.0.0"></script>

  <style>
    :root {
      --bg: #0b1120;
      --card: #131c31;
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      --green: #10b981;
      --blue: #38bdf8;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      max-width: 100vw;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
      min-height: 100vh;
    }

    @media (hover: none) and (pointer: coarse) {
      html, body {
        overscroll-behavior-y: contain;
      }
    }

    body {
      padding: calc(16px + var(--safe-top)) 16px calc(32px + var(--safe-bottom));
    }

    /* Pull-to-refresh icon only */
    #ptrIndicator {
      position: fixed;
      top: calc(10px + var(--safe-top));
      left: 50%;
      transform: translate(-50%, -24px);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
    }
    #ptrIndicator svg {
      width: 16px;
      height: 16px;
      stroke: var(--blue);
    }
    #ptrIndicator.spinning svg {
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    /* Minimal Top Bar */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .brand img {
      width: 36px;
      height: 36px;
      border-radius: 10px;
    }
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #f59e0b;
      display: inline-block;
    }
    .status-dot.online {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    /* Big Scan Button */
    .scan-hero {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px 20px;
      text-align: center;
      margin-bottom: 18px;
    }
    .btn-scan {
      width: 100%;
      padding: 20px;
      border-radius: 18px;
      border: none;
      background: var(--green);
      color: #042f2e;
      font-size: 1.12rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.28);
    }
    .btn-scan:active {
      transform: scale(0.98);
    }
    .btn-import {
      margin-top: 14px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 12px;
    }

    /* Validation Card (After Scan) */
    .workspace {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .preview-box {
      position: relative;
      background: #060911;
      border-radius: 16px;
      padding: 10px;
      text-align: center;
      margin-bottom: 14px;
    }
    #previewCanvas {
      max-width: 100%;
      max-height: 280px;
      border-radius: 8px;
    }
    .preview-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
    }
    .pill-btn {
      padding: 7px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }
    .pill-btn.active {
      border-color: var(--green);
      color: #a7f3d0;
      background: rgba(16, 185, 129, 0.15);
    }

    .field-group {
      margin-bottom: 14px;
    }
    .field-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .input, .select {
      width: 100%;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #080d19;
      color: var(--text);
      font-size: 0.92rem;
      font-weight: 600;
    }
    .input:focus, .select:focus {
      outline: none;
      border-color: var(--green);
    }

    .btn-save {
      width: 100%;
      padding: 17px;
      border-radius: 16px;
      border: none;
      background: var(--green);
      color: #042f2e;
      font-size: 1.02rem;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-save:disabled {
      opacity: 0.5;
    }

    /* Simple List for Unfiled / Recent Docs */
    .list-section {
      margin-top: 18px;
    }
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 10px;
      padding: 0 4px;
    }
    .list-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      margin-bottom: 8px;
    }
    .row-info {
      min-width: 0;
      flex: 1;
    }
    .row-title {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row-sub {
      font-size: 0.74rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .btn-action {
      padding: 8px 13px;
      border-radius: 10px;
      border: none;
      background: var(--green);
      color: #042f2e;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
      text-decoration: none;
    }

    #toast {
      position: fixed;
      top: calc(16px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%) translateY(-16px);
      background: #1e293b;
      border: 1px solid var(--green);
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 700;
      z-index: 950;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="ptrIndicator" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-2.64-6.36" />
      <polyline points="21 3 21 9 15 9" />
    </svg>
  </div>

  <div id="toast"></div>

  <input id="cameraInput" type="file" accept="image/*" capture="environment" class="hidden" />
  <input id="fileInput" type="file" accept="image/*,application/pdf" multiple class="hidden" />

  <div class="container">
    <header class="header">
      <div class="brand">
        <img src="assets/icon.svg" alt="" />
        <span>ScanDoc</span>
      </div>
      <span id="statusDot" class="status-dot" title="Statut Mon Drive"></span>
    </header>

    <!-- ÉTAPE 1 : BOUTON SCANNER -->
    <section id="scanHero" class="scan-hero">
      <button type="button" class="btn-scan" onclick="document.getElementById('cameraInput').click()">
        <span style="font-size:1.3rem;">📸</span>
        <span>Scanner un document</span>
      </button>
      <button type="button" class="btn-import" onclick="document.getElementById('fileInput').click()">
        Importer une photo ou un PDF
      </button>
    </section>

    <!-- ÉTAPE 2 : APERÇU + NOM + DOSSIER + ENREGISTRER -->
    <section id="workspace" class="workspace hidden">
      <div class="preview-box">
        <canvas id="previewCanvas"></canvas>
        <div id="pdfPlaceholder" class="hidden" style="padding:28px 0;font-size:2.4rem;">📕</div>
        <div class="preview-toolbar">
          <div style="display:flex;gap:6px;">
            <button type="button" class="pill-btn" onclick="document.getElementById('cameraInput').click()">+ Page (<span id="pageCountLabel">1</span>)</button>
            <button type="button" class="pill-btn" onclick="rotateCurrentPage()">↻</button>
            <button type="button" id="filterBtn" class="pill-btn active" onclick="toggleFilter()">✨ Scan net</button>
          </div>
          <button type="button" class="pill-btn" onclick="resetScan()">✕</button>
        </div>
      </div>

      <div class="field-group">
        <div class="field-label">
          <span>Nom du fichier</span>
          <span id="aiStatusLabel" style="color:var(--blue);"></span>
        </div>
        <input type="text" id="filenameInput" class="input" />
      </div>

      <div class="field-group">
        <div class="field-label">
          <span>Dossier Mon Drive</span>
        </div>
        <select id="folderSelect" class="select"></select>
      </div>

      <button type="button" id="saveBtn" class="btn-save" onclick="saveScan()">
        ✅ Ranger dans Mon Drive
      </button>
    </section>

    <!-- À TRIER DANS LE DRIVE (affiché uniquement s'il y a des fichiers en vrac à la racine) -->
    <section id="inboxSection" class="list-section hidden">
      <div class="list-header">
        <span>À ranger à la racine du Drive (<span id="inboxCount">0</span>)</span>
        <button type="button" class="pill-btn" onclick="fileAllInbox()">Tout ranger</button>
      </div>
      <div id="inboxList"></div>
    </section>

    <!-- DERNIERS SCANS RANGÉS -->
    <section id="historySection" class="list-section hidden">
      <div class="list-header">
        <span>Récemment rangés</span>
      </div>
      <div id="historyList"></div>
    </section>
  </div>

  <script>
    const embedded = window.SCANDOC_EMBEDDED_DATA || {};
    let driveFolders = embedded.driveFolders || [];
    let inboxItems = [];
    let historyItems = [];

    let apiBaseUrl = "";
    let backendOnline = false;

    let pages = []; // [{ origDataUrl, processedDataUrl, rotation, isPdf, fileName }]
    let filterMode = "magic";
    let currentScanId = "";
    let lastAnalysis = null;

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
    }

    function escapeHtml(s) {
      return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function populateFolders() {
      const sel = document.getElementById("folderSelect");
      const prev = sel.value || "04 - Administratif & carrière/Poste assistant Cochin";
      sel.innerHTML = driveFolders.map((f) =>
        `<option value="${escapeHtml(f.path)}">${escapeHtml(f.emoji || "📁")} ${escapeHtml(f.path)}</option>`
      ).join("");
      if ([...sel.options].some((o) => o.value === prev)) sel.value = prev;
    }

    async function probe(url) {
      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), 2500);
      try {
        const clean = url.replace(/\/$/, "");
        const r = await fetch(`${clean}/api/status?t=${Date.now()}`, { cache: "no-store", signal: ctrl.signal });
        if (!r.ok) return null;
        const d = await r.json();
        return d && d.ok ? clean : null;
      } catch (_) {
        return null;
      } finally {
        clearTimeout(tid);
      }
    }

    async function connectBackend() {
      const candidates = [];
      if (location.port === "8794" || location.hostname.endsWith(".trycloudflare.com")) {
        candidates.push(location.origin);
      }
      candidates.push("http://127.0.0.1:8794");

      for (const u of [`./endpoint.json?t=${Date.now()}`, `https://raw.githubusercontent.com/Mrthomaslef/scan-doc/main/endpoint.json?t=${Date.now()}`]) {
        try {
          const r = await fetch(u, { cache: "no-store" });
          if (r.ok) {
            const ep = await r.json();
            if (ep && ep.tunnelUrl) candidates.push(ep.tunnelUrl);
          }
        } catch (_) {}
      }

      for (const c of [...new Set(candidates.filter(Boolean))]) {
        const okUrl = await probe(c);
        if (okUrl) {
          apiBaseUrl = okUrl;
          backendOnline = true;
          document.getElementById("statusDot").classList.add("online");
          await refreshLists();
          return;
        }
      }
      backendOnline = false;
      document.getElementById("statusDot").classList.remove("online");
    }

    async function refreshLists() {
      if (!backendOnline || !apiBaseUrl) return;
      try {
        const [fRes, iRes, hRes] = await Promise.all([
          fetch(`${apiBaseUrl}/api/folders?t=${Date.now()}`),
          fetch(`${apiBaseUrl}/api/inbox?t=${Date.now()}`),
          fetch(`${apiBaseUrl}/api/history?t=${Date.now()}`)
        ]);
        if (fRes.ok) {
          const fd = await fRes.json();
          if (fd.driveFolders) {
            driveFolders = fd.driveFolders;
            populateFolders();
          }
        }
        if (iRes.ok) {
          const id = await iRes.json();
          inboxItems = id.items || [];
          renderInbox();
        }
        if (hRes.ok) {
          const hd = await hRes.json();
          historyItems = hd.items || [];
          renderHistory();
        }
      } catch (_) {}
    }

    // ==================== CAPTURE & FILTRE ====================
    document.getElementById("cameraInput").addEventListener("change", async (e) => {
      if (e.target.files && e.target.files.length) {
        await handleFiles(Array.from(e.target.files));
        e.target.value = "";
      }
    });

    document.getElementById("fileInput").addEventListener("change", async (e) => {
      if (e.target.files && e.target.files.length) {
        await handleFiles(Array.from(e.target.files));
        e.target.value = "";
      }
    });

    function readDataUrl(file) {
      return new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = () => res(fr.result);
        fr.onerror = rej;
        fr.readAsDataURL(file);
      });
    }

    function filterImage(dataUrl, mode, rotDeg = 0) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const maxD = 1900;
          let w = img.width, h = img.height;
          if (Math.max(w, h) > maxD) {
            const s = maxD / Math.max(w, h);
            w = Math.round(w * s);
            h = Math.round(h * s);
          }
          const c = document.createElement("canvas");
          const rot = ((rotDeg % 360) + 360) % 360;
          c.width = (rot === 90 || rot === 270) ? h : w;
          c.height = (rot === 90 || rot === 270) ? w : h;
          const ctx = c.getContext("2d");
          ctx.save();
          ctx.translate(c.width / 2, c.height / 2);
          ctx.rotate((rot * Math.PI) / 180);
          ctx.drawImage(img, -w / 2, -h / 2, w, h);
          ctx.restore();

          if (mode === "magic") {
            const id = ctx.getImageData(0, 0, c.width, c.height);
            const d = id.data;
            for (let i = 0; i < d.length; i += 4) {
              const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
              const f = lum > 175 ? 1.18 : 1.32;
              d[i] = Math.min(255, Math.max(0, (d[i] - 128) * f + 142));
              d[i + 1] = Math.min(255, Math.max(0, (d[i + 1] - 128) * f + 142));
              d[i + 2] = Math.min(255, Math.max(0, (d[i + 2] - 128) * f + 142));
            }
            ctx.putImageData(id, 0, 0);
          }
          resolve(c.toDataURL("image/jpeg", 0.88));
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl;
      });
    }

    async function handleFiles(files) {
      for (const f of files) {
        const durl = await readDataUrl(f);
        const isPdf = f.type === "application/pdf" || f.name.toLowerCase().endsWith(".pdf");
        const proc = isPdf ? durl : await filterImage(durl, filterMode, 0);
        pages.push({ origDataUrl: durl, processedDataUrl: proc, rotation: 0, isPdf, fileName: f.name });
      }
      document.getElementById("scanHero").classList.add("hidden");
      document.getElementById("workspace").classList.remove("hidden");
      updatePreview();
      await analyzePages();
    }

    function updatePreview() {
      document.getElementById("pageCountLabel").textContent = String(pages.length);
      const last = pages[pages.length - 1];
      if (!last) return;
      const canvas = document.getElementById("previewCanvas");
      const pdfPh = document.getElementById("pdfPlaceholder");
      if (last.isPdf) {
        canvas.classList.add("hidden");
        pdfPh.classList.remove("hidden");
        return;
      }
      pdfPh.classList.add("hidden");
      canvas.classList.remove("hidden");
      const img = new Image();
      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        canvas.getContext("2d").drawImage(img, 0, 0);
      };
      img.src = last.processedDataUrl;
    }

    async function rotateCurrentPage() {
      const last = pages[pages.length - 1];
      if (!last || last.isPdf) return;
      last.rotation = (last.rotation + 90) % 360;
      last.processedDataUrl = await filterImage(last.origDataUrl, filterMode, last.rotation);
      updatePreview();
      await analyzePages();
    }

    async function toggleFilter() {
      filterMode = filterMode === "magic" ? "original" : "magic";
      const btn = document.getElementById("filterBtn");
      btn.classList.toggle("active", filterMode === "magic");
      btn.textContent = filterMode === "magic" ? "✨ Scan net" : "📷 Original";
      for (const p of pages) {
        if (!p.isPdf) p.processedDataUrl = await filterImage(p.origDataUrl, filterMode, p.rotation);
      }
      updatePreview();
    }

    function resetScan() {
      pages = [];
      currentScanId = "";
      lastAnalysis = null;
      document.getElementById("workspace").classList.add("hidden");
      document.getElementById("scanHero").classList.remove("hidden");
    }

    // ==================== ANALYSE IA & SAUVEGARDE ====================
    async function analyzePages() {
      if (!pages.length) return;
      const statusEl = document.getElementById("aiStatusLabel");
      statusEl.textContent = "Analyse IA…";
      const today = new Date().toISOString().slice(0, 10);
      document.getElementById("filenameInput").value = `${today}_Document.pdf`;

      if (backendOnline && apiBaseUrl) {
        try {
          const r = await fetch(`${apiBaseUrl}/api/analyze`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              scanId: currentScanId || `scan_${Date.now()}`,
              filter: filterMode,
              autocrop: true,
              originalFilename: pages[0].fileName || "Scan.jpg",
              images: pages.map((p) => p.isPdf ? p.origDataUrl : p.processedDataUrl)
            })
          });
          if (r.ok) {
            const d = await r.json();
            if (d.ok && d.analysis) {
              currentScanId = d.scanId;
              lastAnalysis = d.analysis;
              const bestName = (d.analysis.suggestedNames && d.analysis.suggestedNames[0])
                ? d.analysis.suggestedNames[0].filename
                : `${today}_Document.pdf`;
              document.getElementById("filenameInput").value = bestName;
              if (d.analysis.recommendedFolder) {
                document.getElementById("folderSelect").value = d.analysis.recommendedFolder;
              }
              statusEl.textContent = `✨ ${d.analysis.docType}`;
              return;
            }
          }
        } catch (_) {}
      }
      statusEl.textContent = "Prêt";
    }

    async function saveScan() {
      if (!pages.length) return;
      const btn = document.getElementById("saveBtn");
      const filename = document.getElementById("filenameInput").value.trim() || "Document.pdf";
      const driveFolder = document.getElementById("folderSelect").value;

      btn.disabled = true;
      btn.textContent = "Enregistrement…";

      try {
        if (!backendOnline) await connectBackend();
        if (backendOnline && apiBaseUrl) {
          const r = await fetch(`${apiBaseUrl}/api/save`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              scanId: currentScanId,
              filename,
              driveFolder,
              copyToVault: lastAnalysis ? Boolean(lastAnalysis.recommendVaultCopy) : true,
              vaultCategory: lastAnalysis ? (lastAnalysis.vaultCategory || "02_Carriere_Medicale_APHP_Diplomes") : "02_Carriere_Medicale_APHP_Diplomes",
              filter: filterMode,
              autocrop: true,
              docType: lastAnalysis ? lastAnalysis.docType : "Document scanné",
              docDate: lastAnalysis ? lastAnalysis.docDate : new Date().toISOString().slice(0, 10),
              summary: lastAnalysis ? lastAnalysis.summary : "",
              images: pages.map((p) => p.isPdf ? p.origDataUrl : p.processedDataUrl)
            })
          });
          const d = await r.json();
          if (r.ok && d.ok) {
            showToast(`✅ Rangé dans ${driveFolder}`);
            resetScan();
            await refreshLists();
            return;
          }
        }
        showToast("⚠️ Mac hors-ligne : réessaie connecté");
      } catch (_) {
        showToast("⚠️ Erreur réseau");
      } finally {
        btn.disabled = false;
        btn.textContent = "✅ Ranger dans Mon Drive";
      }
    }

    // ==================== LISTES SIMPLES (À RANGER & RÉCENTS) ====================
    function renderInbox() {
      const sec = document.getElementById("inboxSection");
      const list = document.getElementById("inboxList");
      document.getElementById("inboxCount").textContent = String(inboxItems.length);
      if (!inboxItems.length) {
        sec.classList.add("hidden");
        return;
      }
      sec.classList.remove("hidden");
      list.innerHTML = inboxItems.map((item, i) => {
        const a = item.analysis || {};
        const targetFolder = a.recommendedFolder || "04 - Administratif & carrière/Poste assistant Cochin";
        const shortFolder = targetFolder.split("/").pop();
        return `
          <div class="list-row">
            <div class="row-info">
              <div class="row-title">📕 ${escapeHtml(item.name)}</div>
              <div class="row-sub">→ 📂 ${escapeHtml(shortFolder)}</div>
            </div>
            <button type="button" class="btn-action" onclick="fileOneInbox(${i})">Ranger</button>
          </div>
        `;
      }).join("");
    }

    async function fileOneInbox(idx) {
      const item = inboxItems[idx];
      if (!item || !backendOnline) return;
      const a = item.analysis || {};
      const keepName = item.name.startsWith("LE_FEVRE_THOMAS_");
      const chosenName = keepName
        ? item.name
        : ((a.suggestedNames && a.suggestedNames[0]) ? a.suggestedNames[0].filename : item.name);
      await fetch(`${apiBaseUrl}/api/inbox/file`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          sourceName: item.name,
          filename: chosenName,
          driveFolder: a.recommendedFolder || "04 - Administratif & carrière/Poste assistant Cochin",
          copyToVault: Boolean(a.recommendVaultCopy),
          vaultCategory: a.vaultCategory || "02_Carriere_Medicale_APHP_Diplomes",
          docType: a.docType || "Document",
          docDate: a.docDate || new Date().toISOString().slice(0, 10)
        })
      });
      showToast(`✅ ${chosenName} rangé !`);
      await refreshLists();
    }

    async function fileAllInbox() {
      for (let i = 0; i < inboxItems.length; i++) {
        await fileOneInbox(i);
      }
    }

    function renderHistory() {
      const sec = document.getElementById("historySection");
      const list = document.getElementById("historyList");
      if (!historyItems.length) {
        sec.classList.add("hidden");
        return;
      }
      sec.classList.remove("hidden");
      list.innerHTML = historyItems.slice(0, 8).map((h) => {
        const url = `${apiBaseUrl}/api/file?path=${encodeURIComponent(h.driveRelPath)}`;
        const shortFolder = (h.driveFolder || "").split("/").pop();
        return `
          <div class="list-row">
            <div class="row-info">
              <div class="row-title">✅ ${escapeHtml(h.filename)}</div>
              <div class="row-sub">📂 ${escapeHtml(shortFolder)} • ${escapeHtml(h.createdAt)}</div>
            </div>
            <a href="${url}" target="_blank" rel="noopener" class="btn-action" style="background:#1e293b;color:#f8fafc;">Voir</a>
          </div>
        `;
      }).join("");
    }

    // Pull to refresh
    (function initPtr() {
      const ptr = document.getElementById("ptrIndicator");
      let startY = 0, pulling = false, dist = 0;
      window.addEventListener("touchstart", (e) => {
        if (window.scrollY <= 0 && e.touches.length === 1) {
          startY = e.touches[0].clientY;
          pulling = true;
          dist = 0;
        }
      }, { passive: true });
      window.addEventListener("touchmove", (e) => {
        if (!pulling) return;
        dist = Math.max(0, e.touches[0].clientY - startY);
        if (dist > 12 && window.scrollY <= 0) {
          ptr.style.opacity = String(Math.min(1, dist / 90));
          ptr.style.transform = `translate(-50%, ${Math.min(24, dist * 0.3 - 16)}px) rotate(${dist * 2.5}deg)`;
        }
      }, { passive: true });
      window.addEventListener("touchend", async () => {
        if (!pulling) return;
        pulling = false;
        if (dist >= 85 && window.scrollY <= 0) {
          ptr.classList.add("spinning");
          ptr.style.opacity = "1";
          await connectBackend();
          setTimeout(() => {
            ptr.classList.remove("spinning");
            ptr.style.opacity = "0";
            ptr.style.transform = "translate(-50%, -24px)";
          }, 400);
        } else {
          ptr.style.opacity = "0";
          ptr.style.transform = "translate(-50%, -24px)";
        }
      }, { passive: true });
    })();

    window.addEventListener("DOMContentLoaded", () => {
      populateFolders();
      connectBackend();
      if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
        navigator.serviceWorker.register("./sw.js?v=2.0.0").catch(() => {});
      }
    });
  </script>
</body>
</html>
